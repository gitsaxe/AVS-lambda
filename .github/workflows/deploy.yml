name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: sam build
      - name: sam deploy
        env:
          CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Set repo secrets BC_CLIENT_ID and BC_CLIENT_SECRET before deploying."
            exit 1
          fi
          OVERRIDES=(ClientId="$CLIENT_ID" ClientSecret="$CLIENT_SECRET")
          if [ -n "$APP_URL" ]; then OVERRIDES+=(AppUrl="$APP_URL"); fi
          sam deploy \
            --stack-name avs-fraud-panel \
            --capabilities CAPABILITY_IAM \
            --s3-bucket simplicity-lambda-storage-121446621497 \
            --s3-prefix avs-fraud-panel \
            --region us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"
