AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Arculus Order Fraud Panel (BigCommerce App Extension)

Parameters:
  ClientId:
    Type: String
  ClientSecret:
    Type: String
    NoEcho: true
  AppUrl:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256

Resources:
  FraudPanelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handler.handler
      CodeUri: .
      Environment:
        Variables:
          CLIENT_ID: !Ref ClientId
          CLIENT_SECRET: !Ref ClientSecret
          APP_URL: !Ref AppUrl
          SSM_PREFIX: /bc-fraud-panel/tokens/
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bc-fraud-panel/tokens/*'
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
              Resource: '*'

Outputs:
  FunctionUrl:
    Description: Set this as APP_URL and as the base of the BigCommerce app callback URLs
    Value: !GetAtt FraudPanelFunctionUrl.FunctionUrl
